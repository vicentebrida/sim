# Instalação de produção mínima: SIM + Postgres + Redis (ADR-0006).
# Uso: copie .env.example para .env, ajuste e rode `docker compose -f docker/compose.yml up -d`.
services:
  sim:
    image: ${SIM_IMAGE:-sim:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://sim:${POSTGRES_PASSWORD:-sim}@postgres:5432/sim
      REDIS_URL: redis://redis:6379
    volumes:
      - sim-data:/data
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Opcional, para a busca semântica sem enviar dados a terceiros:
  #   docker compose -f docker/compose.yml --profile ollama up -d
  #   docker compose -f docker/compose.yml exec ollama ollama pull nomic-embed-text
  # e no .env: SIM_EMBEDDINGS_URL=http://ollama:11434/v1  SIM_EMBEDDINGS_MODEL=nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  # Opcional, antivírus nos Anexos (precisa de uns 2 GB de memória; na primeira subida baixa as
  # assinaturas, o que leva alguns minutos):
  #   docker compose -f docker/compose.yml --profile clamav up -d
  # e no .env: SIM_CLAMAV_URL=tcp://clamav:3310
  clamav:
    image: clamav/clamav-debian:stable
    profiles: [clamav]
    volumes:
      - clamav:/var/lib/clamav
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis:/data
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sim}
      POSTGRES_DB: sim
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sim']
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  clamav:
  ollama:
  sim-data:
  postgres:
  redis:
