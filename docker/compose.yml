# Instalação de produção mínima. Redis entra no Marco 2 (ADR-0006).
# Uso: copie .env.example para .env, ajuste e rode `docker compose -f docker/compose.yml up -d`.
services:
  sim:
    image: ${SIM_IMAGE:-sim:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://sim:${POSTGRES_PASSWORD:-sim}@postgres:5432/sim
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sim}
      POSTGRES_DB: sim
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sim']
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres:
