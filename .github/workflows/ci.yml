name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Testes de integração da API sobem Postgres via Testcontainers (Docker do runner).
      - run: pnpm test
      - run: pnpm build
      - name: Cliente da API está atualizado com o OpenAPI
        run: |
          pnpm generate:api
          git diff --exit-code -- packages/api-client

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/sim --set publicUrl=https://sim.example.com
      - name: Renderiza as combinações principais
        run: |
          helm template sim deploy/helm/sim --set publicUrl=https://sim.example.com > /dev/null
          helm template sim deploy/helm/sim --set publicUrl=https://sim.example.com \
            --set worker.enabled=true --set web.replicas=2 \
            --set postgresql.enabled=false --set externalDatabase.existingSecret=db \
            --set redis.enabled=false --set externalRedis.url=redis://redis:6379 \
            --set ingress.enabled=true --set 'ingress.hosts[0].host=sim.example.com' > /dev/null

  docker:
    # As duas arquiteturas da imagem publicada, cada uma numa máquina dela.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
