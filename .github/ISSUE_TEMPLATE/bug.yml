name: Problema
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: textarea
    attributes:
      label: O que aconteceu
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Entrar como Avaliador
        2. Abrir a Ideia #12
        3. ...
    validations:
      required: true
  - type: input
    attributes:
      label: Versão do SIM
      placeholder: 'ex.: 0.1.0 ou hash do commit'
  - type: dropdown
    attributes:
      label: Login
      options:
        - Conta local
        - SSO (OIDC)
        - SSO (OAuth2 genérico)
  - type: textarea
    attributes:
      label: Logs ou capturas de tela
      description: Remova dados pessoais e segredos antes de colar.
