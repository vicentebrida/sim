{{- if .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sim.fullname" . }}-env
  labels:
    {{- include "sim.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secretEnv }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
---
{{- end }}
{{- if or .Values.postgresql.enabled (and (not .Values.externalDatabase.existingSecret) .Values.externalDatabase.url) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sim.fullname" . }}-database
  labels:
    {{- include "sim.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  {{- $password := include "sim.postgresPassword" . }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgres://sim:%s@%s-postgresql:5432/sim" $password (include "sim.fullname" .) | quote }}
  {{- else }}
  DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
  {{- end }}
{{- else if not .Values.externalDatabase.existingSecret }}
{{- fail "Set postgresql.enabled=true, externalDatabase.url or externalDatabase.existingSecret" }}
{{- end }}
