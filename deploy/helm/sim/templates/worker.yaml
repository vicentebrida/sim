{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sim.fullname" . }}-worker
  labels:
    {{- include "sim.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  # Background jobs are safe to run twice (ADR-0006), but one worker is enough.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sim.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "sim.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/env: {{ toJson .Values.secretEnv | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "sim.pod" (dict "root" . "part" "worker" "mode" "worker") | nindent 6 }}
{{- end }}
